# CRC leave-one-section-out configuration for 12 colorectal cancer sections.
experiment_name: "crc_loso"
project_root: "."
data_root: "data/CRC/cropped_data"
weights_dir: "./weights"
output_root: "./results_crc_loso"

slices: [SN048_1, SN048_2, SN048_3, SN048_4, SN123_1, SN123_2, SN123_4, SN124_1, SN124_2, SN124_4, SN84_1, SN84_2]
# For each fold, the next section in this fixed order is used for validation.
fold_val_map:
  SN048_1: SN048_2
  SN048_2: SN048_3
  SN048_3: SN048_4
  SN048_4: SN123_1
  SN123_1: SN123_2
  SN123_2: SN123_4
  SN123_4: SN124_1
  SN124_1: SN124_2
  SN124_2: SN124_4
  SN124_4: SN84_1
  SN84_1: SN84_2
  SN84_2: SN048_1

files:
  layout: "flat"
  he: "he_cropped/{slide_id}.png"
  label: "label_cropped/{slide_id}.png"
  tissue: "tissue_mask_cropped/{slide_id}.png"

model:
  name: "mit_b1"
  pretrained_imagenet: "single_mit_b1_imagenet.pth"
  patch_size: 224
  context_scale: 2.0
  dropout: 0.15

sampling:
  # patch ratios are computed on detail patches unless noted otherwise.
  min_tissue_ratio: 0.50
  normal_max_tumor_ratio: 0.01
  tumor_min_tumor_ratio: 0.55
  boundary_min_tumor_ratio: 0.05
  boundary_max_tumor_ratio: 0.95
  max_attempts_per_class: 80000
  train_per_slide:
    normal: 300
    tumor: 300
    boundary: 600
  val_per_slide:
    normal: 120
    tumor: 120
    boundary: 240

train:
  seed: 42
  device: "cuda"          # "cuda" or "cpu"
  num_workers: 4
  batch_size: 8
  eval_batch_size: 16
  amp: true
  lr_backbone: 0.00001
  lr_decoder: 0.00010
  lr_mca: 0.00010
  weight_decay: 0.00001
  # Moderate defaults for STHBC debugging. Increase for final paper-level runs.
  detail_epochs: 5
  context_epochs: 5
  single_unfreeze_epoch: 5
  cgs_epochs: 10
  cgs_unfreeze_epoch: 5
  patience: 12
  threshold: 0.50
  validate_whole_slide_every: 1

augmentation:
  enabled: true
  random_flip: true
  random_rot90: true
  color_jitter: true
  gaussian_blur: true

inference:
  stride: 112
  min_tissue_ratio: 0.05
  threshold: 0.50
  postprocess: true
  remove_small_objects: 256
  remove_small_holes: 256
  closing_radius: 2
  save_prob_npy: true
  save_visualization: true
