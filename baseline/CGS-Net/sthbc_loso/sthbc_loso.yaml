# STHBC LOSO configuration for adapting CGS-Net to 8-slice H&E cancer segmentation.
# Copy the whole sthbc_loso folder into:
#   ./sthbc_loso

project_root: "."
data_root: "data/STHBC/resized_data"
weights_dir: "./weights"
output_root: "./results_sthbc_loso"

slices: [C1, D1, H1, E1, F1, G2, A1, B1]
# For each fold, test is the key and validation is the next slice in this fixed order.
fold_val_map:
  C1: D1
  D1: H1
  H1: E1
  E1: F1
  F1: G2
  G2: A1
  A1: B1
  B1: C1

files:
  he: "he_resized.png"
  label: "label_resized.png"
  tissue: "mask_resized.png"

model:
  name: "mit_b1"
  pretrained_imagenet: "single_mit_b1_imagenet.pth"
  patch_size: 224
  context_scale: 2.0
  dropout: 0.15

sampling:
  # patch ratios are computed on detail patches unless noted otherwise.
  min_tissue_ratio: 0.50
  normal_max_tumor_ratio: 0.01
  tumor_min_tumor_ratio: 0.55
  boundary_min_tumor_ratio: 0.05
  boundary_max_tumor_ratio: 0.95
  max_attempts_per_class: 80000
  train_per_slide:
    normal: 300
    tumor: 300
    boundary: 600
  val_per_slide:
    normal: 120
    tumor: 120
    boundary: 240

train:
  seed: 42
  device: "cuda"          # "cuda" or "cpu"
  num_workers: 4
  batch_size: 8
  eval_batch_size: 16
  amp: true
  lr_backbone: 0.00001
  lr_decoder: 0.00010
  lr_mca: 0.00010
  weight_decay: 0.00001
  # Moderate defaults for STHBC debugging. Increase for final paper-level runs.
  detail_epochs: 5
  context_epochs: 5
  single_unfreeze_epoch: 5
  cgs_epochs: 10
  cgs_unfreeze_epoch: 5
  patience: 12
  threshold: 0.50
  validate_whole_slide_every: 1

augmentation:
  enabled: true
  random_flip: true
  random_rot90: true
  color_jitter: true
  gaussian_blur: true

inference:
  stride: 112
  min_tissue_ratio: 0.05
  threshold: 0.50
  postprocess: true
  remove_small_objects: 256
  remove_small_holes: 256
  closing_radius: 2
  save_prob_npy: true
  save_visualization: true
